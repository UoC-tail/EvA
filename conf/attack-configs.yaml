    mutation_config:
      radius: 0.5

  
  EvAttackAcceleratedDebug:
    n_steps: 50
    mutation_rate: 0.005
    tournament_size: 2
    num_population: 256
    num_cross_over: 30
    mutation_toggle_rate: 0.0
    capacity: 128
    mutation_method: "fixed_var"
    mutation_config:
      radius: 0.5
    k_hops: 2

  EVAFAST:
    n_steps: 200
    mutation_rate: 0.02
