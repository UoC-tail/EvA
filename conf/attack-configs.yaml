    mutation_config:
      radius: 0.5
    k_hops: 2
  
  EvAttackAccelerated:
    n_steps: 1024
    mutation_rate: 0.02
    tournament_size: 2
    num_population: 512
    num_cross_over: 30
    mutation_toggle_rate: 0.0
    capacity: 256
    mutation_method: "idx_mutation"
    mutation_config:
      radius: 0.5
    k_hops: 2
    
  EvAttackAcceleratedCE:
    n_steps: 500
    mutation_rate: 0.01
    tournament_size: 2
    num_population: 128
    num_cross_over: 10
    mutation_toggle_rate: 0.0
    capacity: 128
    mutation_method: "uniform"
    mutation_config:
      radius: 0.5
    k_hops: 2

  EvaCertAttack:
    n_steps: 100
    mutation_rate: 0.005
    tournament_size: 2
    num_population: 100
    num_cross_over: 30
