configs:
  PRBCD:
    epochs: 500
    fine_tune_epochs: 100
    keep_heuristic: 'WeightOnly'
    search_space_size: 500_000
    do_synchronize: True
    lr_factor: 100
    loss_type: tanhMargin


  LRBCD:
    epochs: 500
    fine_tune_epochs: 0
    with_early_stopping: False
    keep_heuristic: 'WeightOnly'
    search_space_size: 100_000
    do_synchronize: True
    lr_factor: 100
    loss_type: tanhMargin
  
  greedy_rbcd:
    block_size: 6_000_000
    loss_type: tanhMargin
  FGSM:
    binary_attr: False
    surrogate_model_label: Vanilla Dense GCN
    attack_params:
    loss_type: MCE
  SGA:
    direct: True
    n_influencers: 3
    loss_type: tanhMargin

  DICE:
    add_ratio: 0.6

  LocalDICE:
    add_ratio: 0.1

  Nettack:
    debug_val: True
  PGA:
    greedy_steps: 1
    pre_ratio: 0.1
    select_ratio: 0.6
    influ_ratio: 0.8
    select_policy: deg & margin
    loss_type: tanhMarginMCE-0.5

  PGD:
    
    epochs: 400
    base_lr: 0.1
    loss_type: tanhMargin

  EvAttack:
    n_steps: 10
    mutation_rate: 0.01
    tournament_size: 2
    num_population: 1
    num_cross_over: 30
    mutation_toggle_rate: 0.0

  ScaledEva:
    n_steps: 200
    mutation_rate: 0.02
    tournament_size: 2
    num_population: 128
    num_cross_over: 30
    mutation_toggle_rate: 0.0
    capacity: 128
    mutation_method: "idx_mutation"
    mutation_config:
      radius: 0.5
    k_hops: 2
    

  EvaConformal:
    n_steps: 500
    mutation_rate: 0.01
    tournament_size: 2
    num_population: 1024
    num_cross_over: 30
    mutation_toggle_rate: 0.0
    capacity: 1024
